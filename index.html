<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MobiFone VIP Lounge - Sân Bay Liên Khương</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050b14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .poster-container {
            width: 100%;
            background: #050b14;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .poster-container img {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            object-fit: contain;
        }
        /* Thanh nút bấm cố định cao cấp ở đáy màn hình */
        .bottom-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 11, 20, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(229, 193, 88, 0.35);
            padding: 10px 12px;
            z-index: 50;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.6);
        }
        .gold-border-glow {
            border: 1px solid rgba(229, 193, 88, 0.4);
        }
    </style>
</head>
<body class="pb-28">

    <!-- Ảnh poster hiển thị trực diện, sắc nét -->
    <main class="poster-container">
        <img src="banner.jpg" alt="MobiFone VIP Lounge - Sân Bay Liên Khương" />
    </main>

    <!-- Thanh tác vụ nhanh đẳng cấp bên dưới -->
    <nav class="bottom-action-bar">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
            <button onclick="openActionModal('guideline')" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-gradient-to-b from-blue-700 to-blue-900 text-white shadow-lg active:scale-95 border border-blue-400/30">
                <i class="fa-solid fa-id-card text-yellow-300 text-sm mb-1"></i>
                <span class="text-[10px] font-bold tracking-tight">Quy Trình Vào</span>
            </button>

            <button onclick="openActionModal('loungeInfo')" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-gradient-to-b from-amber-600 to-amber-800 text-white shadow-lg active:scale-95 border border-amber-400/40">
                <i class="fa-solid fa-mug-hot text-yellow-200 text-sm mb-1"></i>
                <span class="text-[10px] font-bold tracking-tight">Phòng Chờ DLI</span>
            </button>

            <a href="tel:0937509888" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-gradient-to-b from-slate-800 to-slate-900 text-white shadow-lg active:scale-95 gold-border-glow">
                <i class="fa-solid fa-headset text-yellow-300 text-sm mb-1"></i>
                <span class="text-[10px] font-bold tracking-tight text-yellow-300">Tổng Đài VIP</span>
            </a>
        </div>
    </nav>

    <!-- Modal hiển thị thông tin -->
    <div id="actionModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0b132b] gold-border-glow w-full max-w-sm rounded-2xl p-5 shadow-2xl relative">
            <button onclick="closeActionModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-base w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modalContent" class="text-slate-200"></div>
        </div>
    </div>

    <script>
        // Tự động cuộn nhẹ 1 pixel khi vừa mở trang để trình duyệt ẩn thanh URL lập tức
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 1);
            }, 0);
        });

        function openActionModal(type) {
            const modal = document.getElementById('actionModal');
            const content = document.getElementById('modalContent');
            
            if (type === 'guideline') {
                content.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="w-12 h-12 bg-blue-600/20 border border-yellow-400/40 rounded-full flex items-center justify-center mx-auto mb-2 text-yellow-400 text-xl">
                            <i class="fa-solid fa-ticket"></i>
                        </div>
                        <h3 class="text-base font-bold text-white">QUY TRÌNH VÀO PHÒNG CHỜ VIP</h3>
                        <p class="text-[11px] text-slate-400 mt-1">Dành riêng cho Hội viên Kết Nối Dài Lâu hạng cao.</p>
                    </div>
                    <div class="space-y-2.5 text-xs">
                        <div class="bg-[#070d1b] p-3 rounded-xl border border-slate-800 flex items-start space-x-2.5">
                            <span class="bg-blue-600 text-white font-bold w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 text-[10px]">1</span>
                            <div>
                                <strong class="text-white block mb-0.5">Xuất trình Thẻ lên máy bay</strong>
                                <span class="text-slate-300 text-[11px]">Chuẩn bị Boarding Pass chuyến bay xuất phát từ Liên Khương.</span>
                            </div>
                        </div>
                        <div class="bg-[#070d1b] p-3 rounded-xl border border-slate-800 flex items-start space-x-2.5">
                            <span class="bg-blue-600 text-white font-bold w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 text-[10px]">2</span>
                            <div>
                                <strong class="text-white block mb-0.5">Mở mã QR trên My MobiFone</strong>
                                <span class="text-slate-300 text-[11px]">Truy cập ứng dụng, lấy mã QR hội viên tương ứng.</span>
                            </div>
                        </div>
                        <div class="bg-[#070d1b] p-3 rounded-xl border border-slate-800 flex items-start space-x-2.5">
                            <span class="bg-yellow-500 text-black font-bold w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 text-[10px]">3</span>
                            <div>
                                <strong class="text-yellow-400 block mb-0.5">Xác nhận & Thư giãn</strong>
                                <span class="text-slate-300 text-[11px]">Lễ tân quét mã hệ thống và mời Quý khách vào không gian VIP.</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (type === 'loungeInfo') {
                content.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="w-12 h-12 bg-amber-600/20 border border-yellow-400/40 rounded-full flex items-center justify-center mx-auto mb-2 text-yellow-400 text-xl">
                            <i class="fa-solid fa-plane-departure"></i>
                        </div>
                        <h3 class="text-base font-bold text-white">SH PREMIUM LOUNGE</h3>
                        <p class="text-[11px] text-slate-400 mt-1">Cảng hàng không quốc tế Liên Khương (Lâm Đồng)</p>
                    </div>
                    <div class="space-y-2.5 text-xs">
                        <div class="bg-[#070d1b] p-3 rounded-xl border border-slate-800">
                            <span class="text-yellow-400 block font-semibold mb-0.5"><i class="fa-solid fa-location-dot mr-1"></i> Vị trí phòng chờ:</span>
                            <span class="text-slate-300 text-[11px]">Tầng 2, Khu vực cách ly ga đi quốc nội (Ga đi quốc nội Liên Khương).</span>
                        </div>
                        <div class="bg-[#070d1b] p-3 rounded-xl border border-slate-800">
                            <span class="text-yellow-400 block font-semibold mb-0.5"><i class="fa-solid fa-clock mr-1"></i> Thời gian phục vụ:</span>
                            <span class="text-slate-300 text-[11px]">05:30 – 21:00 hàng ngày.</span>
                        </div>
                        <div class="bg-[#070d1b] p-3 rounded-xl border border-slate-800">
                            <span class="text-yellow-400 block font-semibold mb-0.5"><i class="fa-solid fa-gem mr-1"></i> Tiện ích thượng hạng:</span>
                            <span class="text-slate-300 text-[11px]">Buffet Á - Âu, trà cà phê đặc sản Đà Lạt, không gian ngắm máy bay sang trọng.</span>
                        </div>
                    </div>
                `;
            }
            modal.classList.remove('hidden');
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.add('hidden');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('actionModal');
            if (event.target === modal) closeActionModal();
        }
    </script>
</body>
</html>
